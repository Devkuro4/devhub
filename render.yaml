# One-click setup for Render (https://render.com). Dev Hub is a single Node service:
# it serves the website AND the AI endpoints, so it needs a real server (not static hosting).
services:
  - type: web
    name: devhub
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GROQ_API_KEY   # required: Groq API key (https://console.groq.com/keys), server only
        sync: false
      - key: GROQ_MODEL     # optional: defaults to openai/gpt-oss-120b
        value: openai/gpt-oss-120b
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # server only: persists competitions, messages, moderation and learning state
        sync: false
      - key: ALLOWED_ORIGINS   # your Vercel site address, e.g. https://yourhub.vercel.app (no trailing slash)
        sync: false
